<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Firebase Login</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
    .auth-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background-color: #0288d1; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    button:hover { background-color: #01579b; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- ฟอร์มเข้าสู่ระบบ / สมัครสมาชิก -->
  <div id="auth-container" class="auth-card">
    <h2 id="form-title">เข้าสู่ระบบ</h2>
    <input type="email" id="email" placeholder="อีเมล">
    <input type="password" id="password" placeholder="รหัสผ่าน">
    <button id="btn-login">เข้าสู่ระบบ</button>
    <button id="btn-signup" style="background-color: #388e3c;">สมัครสมาชิก</button>
    <p id="error-message" style="color: red; font-size: 14px;"></p>
  </div>

  <!-- หน้าเมื่อเข้าสู่ระบบสำเร็จ -->
  <div id="user-container" class="auth-card hidden">
    <h2>ยินดีต้อนรับ!</h2>
    <p id="user-email"></p>
    <button id="btn-logout" style="background-color: #d32f2f;">ออกจากระบบ</button>
  </div>

  <!-- Firebase SDK และ Script การทำงาน -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
     apiKey: "AIzaSyAUiuOs0Hg1bT8PvYy3M42zj9VL84yrxts",
     authDomain: "cenolmal.firebaseapp.com",
     projectId: "cenolmal",
     storageBucket: "cenolmal.firebasestorage.app",
     messagingSenderId: "736326565007",
     appId: "1:736326565007:web:3ba5f4969a1405891584fa",
     measurementId: "G-5VR9N4XBD7"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Elements
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('error-message');
    const authContainer = document.getElementById('auth-container');
    const userContainer = document.getElementById('user-container');
    const userEmailText = document.getElementById('user-email');

    // สมัครสมาชิก
    document.getElementById('btn-signup').addEventListener('click', () => {
      errorMsg.textContent = '';
      createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .catch(error => errorMsg.textContent = error.message);
    });

    // เข้าสู่ระบบ
    document.getElementById('btn-login').addEventListener('click', () => {
      errorMsg.textContent = '';
      signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .catch(error => errorMsg.textContent = error.message);
    });

    // ออกจากระบบ
    document.getElementById('btn-logout').addEventListener('click', () => {
      signOut(auth);
    });

    // ตรวจสอบสถานะผู้ใช้ (Logged In / Logged Out)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authContainer.classList.add('hidden');
        userContainer.classList.remove('hidden');
        userEmailText.textContent = `Email: ${user.email}`;
      } else {
        authContainer.classList.remove('hidden');
        userContainer.classList.add('hidden');
        emailInput.value = '';
        passwordInput.value = '';
      }
    });
  </script>
</body>
</html>
