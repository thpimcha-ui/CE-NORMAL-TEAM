<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf9f6" id="themeColorMeta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CE NORMAL POINT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f6;
    --surface-1:#ffffff;
    --surface-2:#f4f3ef;
    --surface-3:#ebe9e3;
    --border:#e6e4dd;
    --border-strong:#d3d0c6;
    --ink:#201f1c;
    --text-secondary:#726f66;
    --text-muted:#a19e93;
    --accent:#3d5c4f;
    --accent-soft:#557567;
    --accent-bg:#e9efeb;
    --positive:#3d5c4f;
    --negative:#a8493f;
    --negative-bg:#f6ece9;
    --warning:#f39c12;
    --warning-bg:#fcf3cf;
    --gold-1:#c9a227;
    --gold-2:#9b7c1d;
    --silver-1:#9a9a94;
    --silver-2:#6f6f69;
    --bronze-1:#b0764a;
    --bronze-2:#82552f;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --backdrop-color:rgba(32,31,28,.45);
  }
  body[data-theme="dark"]{
    --bg:#14171a;
    --surface-1:#1b1f23;
    --surface-2:#22272c;
    --surface-3:#2a3036;
    --border:#333a40;
    --border-strong:#454d54;
    --ink:#eef0f0;
    --text-secondary:#a3aab0;
    --text-muted:#767d83;
    --accent:#48c792; /* ปรับสีเขียวให้สว่างขึ้นสำหรับโหมดมืด (Neon green vibe) */
    --accent-soft:#87b9a4;
    --accent-bg:#1f2e28;
    --negative:#d3877a;
    --negative-bg:#3a2320;
    --warning:#f39c12;
    --warning-bg:#4a3c10;
    --backdrop-color:rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    transition:background .15s ease, color .15s ease;
  }
  body:not(.is-admin) .admin-only{display:none !important;}
  .app{max-width:1080px;margin:0 auto;padding:28px 24px 80px;}

  /* ---------- header ---------- */
  header.top{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:20px;flex-wrap:wrap;
    padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:16px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand h1{
    font-family:var(--font-display);font-weight:600;font-size:25px;
    margin:0 0 2px;letter-spacing:.2px;color:var(--ink);
  }
  .brand p{margin:0;color:var(--text-secondary);font-size:13.5px;}
  .top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  select.period{
    background:var(--surface-1);border:1px solid var(--border-strong);color:var(--ink);
    font-family:var(--font-mono);font-size:13px;padding:9px 12px;border-radius:var(--radius-sm);
    cursor:pointer;
  }
  select.period:focus{outline:none;border-color:var(--accent);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;
    padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
    background:var(--surface-1);color:var(--ink);cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .btn:hover{background:var(--surface-2);border-color:var(--accent);}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-soft);border-color:var(--accent-soft);}
  .btn.ghost{background:transparent;}
  .btn.danger{border-color:var(--negative);color:var(--negative);background:transparent;}
  .btn.danger:hover{background:var(--negative-bg);}
  .btn.warning{border-color:var(--warning);color:var(--warning);background:transparent;}
  .btn.warning:hover{background:var(--warning-bg);}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .btn svg{width:14px;height:14px;flex:none;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn:disabled:hover{background:var(--surface-1);border-color:var(--border-strong);}

  .admin-toggle{
    display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-secondary);
    border:1px solid var(--border-strong);border-radius:20px;padding:5px 6px 5px 12px;background:var(--surface-1);
  }
  .admin-toggle.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
  .admin-toggle button{
    border:none;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;
    padding:5px 10px;border-radius:14px;cursor:pointer;
  }
  .admin-toggle.on button{background:var(--accent);}
  .admin-toggle svg{width:13px;height:13px;}
  .theme-toggle{
    width:36px;height:36px;border-radius:50%;border:1px solid var(--border-strong);
    background:var(--surface-1);color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .theme-toggle:hover{background:var(--surface-2);border-color:var(--accent);}
  .theme-toggle svg{width:17px;height:17px;}
  .viewer-banner{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:9px 14px;font-size:12.5px;color:var(--text-secondary);margin-bottom:18px;
  }
  .viewer-banner.employee-active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);}
  .viewer-banner.admin-notif{background:var(--warning-bg);color:var(--warning);border-color:var(--warning);cursor:pointer;}
  .viewer-banner svg{width:14px;height:14px;flex:none;}

  /* ---------- tabs ---------- */
  nav.tabs{display:flex;gap:4px;margin-bottom:26px;border-bottom:1px solid var(--border);}
  nav.tabs button{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;
    background:none;border:none;color:var(--text-muted);cursor:pointer;
    padding:11px 16px;border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:color .15s ease;
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}

  h2.section-title{
    font-family:var(--font-display);font-weight:600;font-size:19px;margin:0 0 14px;color:var(--ink);
  }
  .subtle{color:var(--text-secondary);font-size:13px;}

  /* ---------- Admin stat cards ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px;}
  .stat-card{
    background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:16px 18px;
  }
  .stat-card .label{font-size:12px;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;}
  .stat-card .value{font-family:var(--font-mono);font-weight:600;font-size:25px;color:var(--accent);}
  .stat-card .value.neg{color:var(--negative);}
  .stat-card .sub{font-size:12px;color:var(--text-muted);margin-top:4px;}

  /* ---------- Employee Dashboard CSS ---------- */
  .emp-dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .emp-stat-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 22px; position:relative; overflow:hidden;}
  .emp-stat-title { font-size: 11.5px; font-weight:600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 8px; }
  .emp-stat-value { font-family: var(--font-display); font-size: 34px; font-weight: 600; color: var(--accent); margin-bottom: 4px; line-height: 1.1;}
  .emp-stat-sub { font-size: 13px; color: var(--text-secondary); line-height:1.5;}
  
  .target-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 22px; margin-bottom: 24px; }
  .target-header { display: flex; justify-content: space-between; align-items:center; margin-bottom: 12px; font-size: 11.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing:0.5px;}
  .target-name { font-family: var(--font-display); font-size: 28px; font-weight: 600; margin-bottom: 4px; }
  .target-pts { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 16px; font-weight:500; font-family: var(--font-mono); }
  .progress-bar { height: 10px; background: var(--surface-3); border-radius: 5px; overflow: hidden; margin-bottom: 14px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 5px; transition: width 0.5s ease-in-out;}
  
  .top3-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
  .top3-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px 16px; text-align: center; }
  .top3-rank-icon { font-size: 26px; margin-bottom: 12px; line-height:1;}
  .top3-name { font-weight: 600; font-size: 15px; margin-bottom: 6px; text-transform: uppercase; letter-spacing:0.5px;}
  .top3-pts { font-family: var(--font-display); font-size: 28px; font-weight:600; color: var(--ink); margin-bottom: 6px; line-height:1;}
  .top3-streak { font-size: 11px; color: var(--warning); font-weight: 600; text-transform: uppercase; letter-spacing:0.5px;}

  /* ---------- top3 table (Admin) ---------- */
  .top3-table{width:100%;border-collapse:collapse;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:28px;}
  .top3-table th{
    text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);
    font-weight:600;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);
  }
  .top3-table td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .top3-table tr:last-child td{border-bottom:none;}
  .rank-badge{
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-weight:600;font-size:12px;color:#fff;
  }
  .rank-badge.r1{background:linear-gradient(180deg,var(--gold-1),var(--gold-2));}
  .rank-badge.r2{background:linear-gradient(180deg,var(--silver-1),var(--silver-2));}
  .rank-badge.r3{background:linear-gradient(180deg,var(--bronze-1),var(--bronze-2));}
  .top3-pts{font-family:var(--font-mono);font-weight:600;font-size:14.5px;color:var(--accent);text-align:right;}

  /* ---------- leaderboard ---------- */
  .leaderboard{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:28px;}
  .lb-row{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--border);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{font-family:var(--font-mono);font-size:13px;color:var(--text-muted);width:18px;flex:none;}
  .avatar{
    width:34px;height:34px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-weight:600;font-size:12px;color:#fff;
  }
  .lb-name{flex:1;min-width:0;}
  .lb-name .n{font-weight:600;font-size:14px;}
  .lb-name .d{font-size:12px;color:var(--text-muted);}
  .lb-bar-wrap{width:110px;flex:none;height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;}
  .lb-bar{height:100%;background:var(--accent);border-radius:3px;}
  .lb-pts{font-family:var(--font-mono);font-weight:600;font-size:14px;color:var(--accent);width:56px;text-align:right;flex:none;}

  /* ---------- Rank Labels ---------- */
  .rank-badge-text { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; font-family: var(--font-mono); display:inline-block; }
  .rank-Silver { background: #e0e0e0; color: #333; }
  .rank-Gold { background: #f1c40f; color: #000; }
  .rank-Diamond { background: #3498db; color: #fff; }
  .rank-Master { background: #9b59b6; color: #fff; }
  .rank-Predator { background: #e74c3c; color: #fff; }
  body[data-theme="dark"] .rank-Silver { background: #4a4a4a; color: #eee; }

  /* ---------- year trend ---------- */
  .trend-card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px 14px;margin-bottom:8px;}
  .trend-chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px;}
  .trend-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .trend-bar{width:100%;max-width:26px;background:var(--surface-3);border-radius:3px 3px 0 0;min-height:2px;transition:background .15s;}
  .trend-col.cur .trend-bar{background:var(--accent);}
  .trend-label{font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono);}

  /* ---------- employee grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .emp-card{
    background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:16px;cursor:pointer;transition:border-color .15s ease, transform .1s ease;
    position:relative;
  }
  .emp-card:hover{border-color:var(--border-strong);transform:translateY(-1px);}
  .emp-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .emp-top .avatar{width:42px;height:42px;font-size:13.5px;}
  .emp-top .n{font-weight:600;font-size:14.5px;}
  .emp-top .d{font-size:12px;color:var(--text-muted);}
  .emp-balance{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .emp-balance .num{font-family:var(--font-mono);font-weight:600;font-size:23px;color:var(--accent);}
  .emp-balance .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;}
  .emp-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .emp-actions .btn{flex:1;justify-content:center;min-width:65px; padding: 6px 8px;}

  /* ---------- reward grid ---------- */
  .rw-card{
    background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:16px;display:flex;flex-direction:column;gap:12px;
  }
  .rw-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .rw-icon{
    width:38px;height:38px;border-radius:var(--radius-sm);background:var(--accent-bg);
    display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;
  }
  .rw-icon svg{width:20px;height:20px;}
  .rw-edit-actions{display:flex;gap:4px;}
  .icon-btn{
    background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;
    display:flex;border-radius:5px;
  }
  .icon-btn:hover{color:var(--ink);background:var(--surface-2);}
  .icon-btn svg{width:15px;height:15px;}
  .rw-name{font-weight:600;font-size:14.5px;}
  .rw-cost{font-family:var(--font-mono);color:var(--accent);font-weight:600;font-size:15px;}

  /* ---------- ledger ---------- */
  .ledger-filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .ledger-list{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
  .led-row{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--border);}
  .led-row:last-child{border-bottom:none;}
  .led-date{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);width:74px;flex:none;}
  .led-badge{
    font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;flex:none;
    text-transform:uppercase;letter-spacing:.3px;
  }
  .led-badge.earn{background:var(--accent-bg);color:var(--accent);}
  .led-badge.redeem{background:var(--negative-bg);color:var(--negative);}
  .led-badge.pending{background:var(--warning-bg);color:var(--warning);}
  .led-emp{flex:1;min-width:0;}
  .led-emp .n{font-weight:600;font-size:13.5px;}
  .led-emp .note{font-size:12px;color:var(--text-muted);}
  .led-pts{font-family:var(--font-mono);font-weight:600;font-size:14px;flex:none;width:64px;text-align:right;}
  .led-pts.pos{color:var(--accent);}
  .led-pts.neg{color:var(--negative);}
  .led-pts.warn{color:var(--warning);}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:var(--backdrop-color);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--surface-1);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
    width:100%;max-width:420px;padding:22px;max-height:88vh;overflow-y:auto;
  }
  .modal h3{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0 0 16px;color:var(--ink);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--text-secondary);margin-bottom:6px;font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--surface-1);border:1px solid var(--border-strong);color:var(--ink);
    padding:10px 12px;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:14px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
  .modal-error{color:var(--negative);font-size:12.5px;margin-top:-6px;margin-bottom:10px;display:none;}
  .seg-toggle{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:14px;}
  .seg-toggle button{
    flex:1;border:none;background:var(--surface-1);color:var(--text-secondary);font-family:var(--font-body);
    font-weight:600;font-size:13.5px;padding:10px;cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  .seg-toggle button + button{border-left:1px solid var(--border-strong);}
  .seg-toggle button.active.add{background:var(--accent-bg);color:var(--accent);}
  .seg-toggle button.active.deduct{background:var(--negative-bg);color:var(--negative);}

  /* ---------- detail modal / history ---------- */
  .detail-balance{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface-2);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:16px;
  }
  .detail-balance .num{font-family:var(--font-mono);font-size:27px;font-weight:600;color:var(--accent);}
  .detail-history{max-height:280px;overflow-y:auto;}
  .detail-history .led-row{padding:10px 4px;}

  /* ---------- stamp signature ---------- */
  .stamp-layer{
    position:fixed;inset:0;pointer-events:none;z-index:200;
    display:flex;align-items:center;justify-content:center;
  }
  .stamp-mark{
    font-family:var(--font-display);font-weight:600;font-size:32px;color:var(--ink);
    border:4px solid var(--ink);border-radius:14px;padding:10px 26px;
    transform:rotate(-8deg) scale(0.4);opacity:0;
    letter-spacing:2px;text-transform:uppercase;
    transition:transform .38s cubic-bezier(.2,1.4,.4,1), opacity .38s ease;
    background: var(--surface-1);
  }
  .stamp-mark.show{transform:rotate(-8deg) scale(1);opacity:.95;}

  .empty-hint{
    border:1.5px dashed var(--border-strong);border-radius:var(--radius-md);
    padding:40px 20px;text-align:center;color:var(--text-secondary);font-size:13.5px;
  }
  .empty-hint .btn{margin-top:14px;}

  @media (max-width:600px){
    .app{padding:16px 14px 60px;}
    header.top{gap:12px;padding-bottom:16px;}
    .brand h1{font-size:21px;}
    .top-actions{width:100%;gap:8px;}
    .top-actions select.period{flex:1 1 auto;min-width:0;}
    #btnAddPoints{flex:1 1 100%;justify-content:center;order:3;}
    .admin-toggle{font-size:12px;padding:4px 5px 4px 10px;}
    .admin-toggle button{padding:5px 8px;}

<script>
// ==========================================
// 1. นำตั้งค่า Firebase มาวางแทนที่ตรงนี้
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyAUiuOs0Hg1bT8PvYy3M42zj9VL84yrxts",
  authDomain: "cenolmal.firebaseapp.com",
  projectId: "cenolmal",
  storageBucket: "cenolmal.firebasestorage.app",
  messagingSenderId: "736326565007",
  appId: "1:736326565007:web:3ba5f4969a1405891584fa"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// ==========================================

const STORAGE_KEY = 'team-points-tracker-v1';
const MONTHS_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const AVATAR_COLORS = ['#3d5c4f','#6b5b53','#a8493f','#557567','#7a6a4f','#4f5c6b'];

let state = { employees: [], pointsLog: [], rewards: [], redemptions: [], adminPin: '' };
let activeTab = 'dashboard';
let isAdmin = false;
let currentEmployeeId = null;
const now = new Date();
let selMonth = now.getMonth() + 1;
let selYear = now.getFullYear();

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function colorFor(id){ let h=0; for(const c of id) h = (h*31 + c.charCodeAt(0)) % AVATAR_COLORS.length; return AVATAR_COLORS[Math.abs(h)]; }
function fmt(n){ return new Intl.NumberFormat('th-TH', { maximumFractionDigits: 1 }).format(n); }

// Rank & Target System
function getRank(streak) {
  const s = streak || 0;
  if(s >= 10) return { name: 'Predator', pts: 4, class: 'rank-Predator', icon: '🐺' };
  if(s >= 7) return { name: 'Master', pts: 2.5, class: 'rank-Master', icon: '🔥' };
  if(s >= 5) return { name: 'Diamond', pts: 2, class: 'rank-Diamond', icon: '💎' };
  if(s >= 3) return { name: 'Gold', pts: 1.5, class: 'rank-Gold', icon: '🏆' };
  return { name: 'Silver', pts: 1, class: 'rank-Silver', icon: '⚪' };
}

async function loadData(){
  try{
    const docRef = db.collection('appData').doc(STORAGE_KEY);
    const docSnap = await docRef.get();
    
    if (docSnap.exists) {
      const data = docSnap.data();
      if (data && data.stateJSON) {
        state = Object.assign(
          {employees:[], pointsLog:[], rewards:[], redemptions:[], adminPin:''}, 
          JSON.parse(data.stateJSON)
        );
      }
    }
  }catch(e){ 
    console.error('โหลดข้อมูลจาก Firestore ล้มเหลว', e); 
  }
  render();
}

async function saveData(){
  try{ 
    await db.collection('appData').doc(STORAGE_KEY).set({
      stateJSON: JSON.stringify(state)
    });
  }
  catch(e){ 
    console.error('บันทึกข้อมูลไป Firestore ล้มเหลว', e); 
  }
}

function getBalance(empId){
  const earned = state.pointsLog.filter(p=>p.employeeId===empId).reduce((s,p)=>s+p.points,0);
  // หักคะแนนเฉพาะรายการที่ได้รับการอนุมัติ หรือกำลังรออนุมัติ (ไม่รวมที่ยกเลิก)
  const spent = state.redemptions
    .filter(r => r.employeeId === empId && r.status !== 'rejected' && r.cancelled !== true)
    .reduce((s,r)=>s+r.pointsSpent,0);
  return earned - spent;
}
function getMonthlyEarned(empId, year, month){
  return state.pointsLog.filter(p=>p.employeeId===empId && p.year===year && p.month===month).reduce((s,p)=>s+p.points,0);
}
function getYearlyEarned(empId, year){
  return state.pointsLog.filter(p=>p.employeeId===empId && p.year===year).reduce((s,p)=>s+p.points,0);
}
function getAllTimeEarned(empId){
  return state.pointsLog.filter(p=>p.employeeId===empId).reduce((s,p)=>s+p.points,0);
}

/* ---------------- render ---------------- */
function render(){
  renderAdminToggle();
  renderEmpToggle();
  renderBanner();
  renderPeriodSelects();
  renderTabs();
  
  if(activeTab==='dashboard') renderDashboard();
  if(activeTab==='employees') renderEmployees();
  if(activeTab==='rewards') renderRewards();
  if(activeTab==='ledger') renderLedger();
}

function renderBanner(){
  const el = document.getElementById('viewerBanner');
  const txt = document.getElementById('viewerBannerText');
  const notif = document.getElementById('adminNotifBanner');
  const notifTxt = document.getElementById('adminNotifText');
  
  const pendingCount = state.redemptions.filter(r => r.status === 'pending').length;
  
  if(isAdmin){
    el.style.display = 'none';
    if(pendingCount > 0) {
      notif.style.display = 'flex';
      notifTxt.textContent = `มีคำขอแลกรางวัลรอการอนุมัติ ${pendingCount} รายการ คลิกเพื่อตรวจสอบ`;
    } else {
      notif.style.display = 'none';
    }
    return;
  }
  
  notif.style.display = 'none';
  el.style.display = 'flex';
  
  if(currentEmployeeId){
    const emp = state.employees.find(x=>x.id===currentEmployeeId);
    el.classList.add('employee-active');
    txt.textContent = emp ? `เข้าสู่ระบบในฐานะ ${emp.name} · แต้มคงเหลือ ${fmt(getBalance(emp.id))} แต้ม · แลกของรางวัลให้ตัวเองได้ที่แท็บ "รางวัล"` : 'เข้าสู่ระบบพนักงานแล้ว';
  } else {
    el.classList.remove('employee-active');
    txt.textContent = 'โหมดดูอย่างเดียว — เลือกระบุตัวตนเพื่อดู Dashboard ของตัวเอง หรือเข้าสู่ระบบแอดมินเพื่อจัดการข้อมูล';
  }
}

/* ---------------- Admin Auth & Reset ---------------- */
function renderAdminToggle(){
  document.body.classList.toggle('is-admin', isAdmin);
  const el = document.getElementById('adminToggle');
  el.classList.toggle('on', isAdmin);
  if(isAdmin){
    el.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1.5"/></svg>
      แอดมิน
      <button onclick="logoutAdmin()">ออกจากระบบ</button>
    `;
  } else {
    el.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      ผู้ดู
      <button onclick="openAdminLoginModal()">เข้าสู่ระบบ</button>
    `;
  }
}
function logoutAdmin(){ isAdmin = false; render(); }

function openAdminLoginModal(){
  if(!state.adminPin){
    openModal(`
      <h3>ตั้งรหัสผ่านแอดมิน</h3>
      <div class="subtle" style="margin-bottom:14px;">ยังไม่มีการตั้งรหัสผ่านแอดมิน ตั้งรหัสผ่านครั้งแรกเพื่อเริ่มใช้งาน (ทีมสามารถใช้รหัสเดียวกันร่วมกันได้)</div>
      <div class="field"><label>ตั้งรหัสผ่านใหม่</label><input id="pinNew" type="password" placeholder="อย่างน้อย 4 ตัวอักษร"></div>
      <div class="field"><label>ยืนยันรหัสผ่าน</label><input id="pinConfirm" type="password"></div>
      <div class="modal-error" id="mErr">รหัสผ่านไม่ตรงกันหรือสั้นเกินไป</div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
        <button class="btn primary" onclick="setAdminPin()">ตั้งรหัสผ่านและเข้าสู่ระบบ</button>
      </div>
    `);
  } else {
    openModal(`
      <h3>เข้าสู่ระบบแอดมิน</h3>
      <div class="field"><label>รหัสผ่านแอดมิน</label><input id="pinEnter" type="password" placeholder="กรอกรหัสผ่าน"></div>
      <div class="modal-error" id="mErr">รหัสผ่านไม่ถูกต้อง</div>
      <div class="modal-actions" style="justify-content: space-between;">
        <button class="btn danger ghost" onclick="openAdminResetModal()">เปลี่ยนรหัสผ่าน</button>
        <div style="display:flex; gap:10px;">
          <button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
          <button class="btn primary" onclick="checkAdminPin()">เข้าสู่ระบบ</button>
        </div>
      </div>
    `);
  }
  setTimeout(()=>{ const f=document.getElementById('pinEnter')||document.getElementById('pinNew'); if(f) f.focus(); }, 30);
}

function openAdminResetModal() {
  openModal(`
    <h3>เปลี่ยนรหัสผ่านแอดมิน</h3>
    <div class="field"><label>รหัสผ่านเดิม</label><input id="pinOld" type="password" placeholder="กรอกรหัสผ่านปัจจุบัน"></div>
    <div class="field"><label>รหัสผ่านใหม่</label><input id="pinNew" type="password" placeholder="อย่างน้อย 4 ตัวอักษร"></div>
    <div class="modal-error" id="mErrReset">รหัสผ่านเดิมไม่ถูกต้อง หรือรหัสใหม่สั้นเกินไป</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="openAdminLoginModal()">ย้อนกลับ</button>
      <button class="btn primary" onclick="confirmResetAdminPassword()">ยืนยัน</button>
    </div>
  `);
  setTimeout(()=>{ document.getElementById('pinOld').focus(); }, 30);
}

function confirmResetAdminPassword() {
  const oldPin = document.getElementById('pinOld').value;
  const newPin = document.getElementById('pinNew').value;
  
  if (oldPin !== state.adminPin || !newPin || newPin.length < 4) {
    document.getElementById('mErrReset').style.display = 'block';
    return;
  }
  
  state.adminPin = newPin;
  saveData();
  alert('เปลี่ยนรหัสผ่านแอดมินสำเร็จ!');
  openAdminLoginModal();
}

function setAdminPin(){
  const a = document.getElementById('pinNew').value;
  const b = document.getElementById('pinConfirm').value;
  if(!a || a.length<4 || a!==b){ document.getElementById('mErr').style.display='block'; return; }
  state.adminPin = a; saveData();
  isAdmin = true; closeModal(); render();
}
function checkAdminPin(){
  const v = document.getElementById('pinEnter').value;
  if(v !== state.adminPin){ document.getElementById('mErr').style.display='block'; return; }
  isAdmin = true; closeModal(); render();
}

/* ---------------- employee self-service login (NO PASSWORD) ---------------- */
function renderEmpToggle(){
  const el = document.getElementById('empToggle');
  el.classList.toggle('on', !!currentEmployeeId);
  if(currentEmployeeId){
    const emp = state.employees.find(x=>x.id===currentEmployeeId);
    el.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
      ${emp ? escapeHtml(emp.name) : 'พนักงาน'}
      <button onclick="logoutEmployee()">ออกจากระบบ</button>
    `;
  } else {
    el.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
      พนักงาน
      <button onclick="openEmployeeLoginModal()">ระบุตัวตนพนักงาน</button>
    `;
  }
}
function logoutEmployee(){ currentEmployeeId = null; render(); }

function openEmployeeLoginModal(){
  if(state.employees.length===0){ alert('ยังไม่มีพนักงานในระบบ ให้แอดมินเพิ่มพนักงานก่อน'); return; }
  openModal(`
    <h3>ระบุตัวตนของคุณ</h3>
    <div class="subtle" style="margin-bottom:14px;">เลือกชื่อของคุณเพื่อดู Dashboard ของตัวเองและใช้แลกรางวัล</div>
    <div class="field">
      <label>เลือกชื่อของคุณ</label>
      <select id="eSelEmp">${state.employees.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('')}</select>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn primary" onclick="submitEmployeeLogin()">เข้าสู่ระบบ</button>
    </div>
  `);
}

function submitEmployeeLogin(){
  const empId = document.getElementById('eSelEmp').value;
  if(!empId) return;
  currentEmployeeId = empId; 
  closeModal(); 
  render();
}

/* ---------------- Period Selection ---------------- */
function renderPeriodSelects(){
  const ms = document.getElementById('monthSelect');
  const ys = document.getElementById('yearSelect');
  if(!ms.options.length){
    ms.innerHTML = MONTHS_TH.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');
    ms.value = selMonth;
    ms.onchange = ()=>{ selMonth = Number(ms.value); render(); };
  }
  if(!ys.options.length){
    const years = new Set();
    for(let y=2026; y<=2030; y++) years.add(y);
    state.pointsLog.forEach(p => years.add(p.year));
    years.delete(2025); 
    
    const sorted = [...years].sort((a,b)=>a-b);
    ys.innerHTML = sorted.map(y=>`<option value="${y}">ปี ${y}</option>`).join('');
    
    if (selYear < 2026) selYear = 2026;
    ys.value = selYear;
    ys.onchange = ()=>{ selYear = Number(ys.value); render(); };
  }
}

function renderTabs(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===activeTab);
  });
  document.querySelectorAll('.tab-panel').forEach(p=>{
    p.classList.toggle('active', p.id === 'panel-'+activeTab);
  });
}

/* ---------------- DASHBOARD LOGIC ---------------- */
function renderDashboard() {
  if (!isAdmin && currentEmployeeId) {
    renderEmployeeDashboard();
  } else {
    renderAdminDashboard();
  }
}

// 1) Dashboard สำหรับแอดมิน (หรือคนที่ยังไม่เข้าระบบพนักงาน)
function renderAdminDashboard(){
  const allEarned = state.pointsLog.reduce((s,p)=>s+p.points,0);
  const allRedeemed = state.redemptions.filter(r=>!r.cancelled && r.status!=='rejected').reduce((s,r)=>s+r.pointsSpent,0);
  const allTimeTop = [...state.employees].map(e=>({e, pts:getAllTimeEarned(e.id)})).sort((a,b)=>b.pts-a.pts)[0];
  
  let html = `
    <h2 class="section-title">ภาพรวมแอดมินทั้งหมด (ตลอดกาล)</h2>
    <div class="stat-row" id="allTimeRow">
      <div class="stat-card">
        <div class="label">แต้มที่แจกไปทั้งหมด</div>
        <div class="value">${fmt(allEarned)}</div>
        <div class="sub">ตั้งแต่เริ่มใช้งาน</div>
      </div>
      <div class="stat-card">

  const monthEarned = state.pointsLog.filter(p=>p.year===selYear && p.month===selMonth).reduce((s,p)=>s+p.points,0);

        <div class="value neg">${fmt(monthRedeemed)}</div>
        <div class="sub">รวมของรางวัลทั้งหมด</div>
      </div>
      <div class="stat-card">
        <div class="label">จำนวนพนักงาน</div>
        <div class="value">${state.employees.length}</div>
        <div class="sub">คนในทีม</div>
      </div>
    </div>
  `;

  const ranked = [...state.employees].map(e=>({e, pts:getMonthlyEarned(e.id, selYear, selMonth)}))
    .sort((a,b)=>b.pts-a.pts);
  const top3 = ranked.slice(0,3).filter(r=>r.pts>0);

  html += `<h2 class="section-title">TOP 3 ประจำเดือน</h2><table class="top3-table" id="top3Table">`;

    html += `<tr><td class="empty-state">ยังไม่มีใครได้แต้มในเดือนนี้</td></tr>`;
  } else {
    html += `<tr><th>อันดับ</th><th>ชื่อ</th><th>แผนก</th><th style="text-align:right;">แต้มเดือนนี้</th></tr>` + 
      top3.map((r,i)=>`

          <td><div class="rank-badge r${i+1}">${i+1}</div></td>

          <td class="top3-pts">${fmt(r.pts)}</td>

  html += `</table>`;

  const maxPts = Math.max(1, ...ranked.map(r=>r.pts));
  html += `<h2 class="section-title">อันดับทั้งหมดประจำเดือน</h2><div class="leaderboard" id="leaderboard">`;

    html += `<div class="empty-state">ยังไม่มีพนักงานในระบบ ไปที่แท็บ "ทีมงาน" เพื่อเพิ่มคนแรก</div>`;

  html += `</div>`;

  const monthlyTotals = Array.from({length:12}, (_,i)=>{
    return state.pointsLog.filter(p=>p.year===selYear && p.month===i+1).reduce((s,p)=>s+p.points,0);
  });
  const maxM = Math.max(1, ...monthlyTotals);
  
  html += `
    <h2 class="section-title">แนวโน้มแต้มทั้งปี</h2>
    <div class="trend-card">
      <div class="subtle">รวมแต้มที่มอบให้ในปี ${selYear}</div>
      <div class="trend-chart">

          <div class="trend-col ${i+1===selMonth?'cur':''}">

  document.getElementById('panel-dashboard').innerHTML = html;

/* ---------------- Streak System ---------------- */
function addStreak(empId) {
  if(!isAdmin) return;
  const e = state.employees.find(x => x.id === empId);
  e.streak = (e.streak || 0) + 1;
  const rankInfo = getRank(e.streak);
  
  // บันทึกคะแนน
  state.pointsLog.push({
    id: uid(), 
    employeeId: empId, 
    points: rankInfo.pts, 
    month: selMonth, 
    year: selYear, 
    reason: `🔥 Target Streak เดือนที่ ${e.streak} (${rankInfo.name})`, 
    date: new Date().toISOString()
  });
  
  saveData(); render();
}

function resetStreak(empId) {
  if(!isAdmin) return;
  if(!confirm('ยืนยันการรีเซ็ต Streak กลับไปเป็น 0?')) return;
  const e = state.employees.find(x => x.id === empId);
  e.streak = 0;
  saveData(); render();
}

function approveRedeem(id) {
  if(!isAdmin) return;
  const r = state.redemptions.find(x => x.id === id);
  if(r) {
    r.status = 'approved';
    saveData(); render();
  }
}

function rejectRedeem(id) {
  if(!isAdmin) return;
  if(!confirm('ปฏิเสธคำขอนี้และคืนแต้มให้พนักงาน?')) return;
  const r = state.redemptions.find(x => x.id === id);
  if(r) {
    r.status = 'rejected';
    r.cancelDate = new Date().toISOString();
    saveData(); render();
  }
}

function renderLedger(){
  const empFilter = document.getElementById('filterEmployee');
  if(empFilter.options.length<=1){
    empFilter.innerHTML = '<option value="">พนักงานทั้งหมด</option>' +
      state.employees.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('');
    empFilter.onchange = renderLedger;
    document.getElementById('filterType').onchange = renderLedger;
  }
  const empVal = empFilter.value;
  const typeVal = document.getElementById('filterType').value;

  let rows = [];
  state.pointsLog.forEach(p=>{
    const isDeduct = p.points < 0;
    rows.push({type: isDeduct ? 'deduct' : 'earn', id: p.id, date:p.date, employeeId:p.employeeId, points:p.points, note:p.reason||(isDeduct?'หักแต้ม':'ให้แต้ม')});
  });
  
  state.redemptions.forEach(r=>{
    const rw = state.rewards.find(x=>x.id===r.rewardId);
    const note = rw ? rw.name : 'ของรางวัล (ถูกลบแล้ว)';
    
    const isPending = r.status === 'pending';
    const isRejected = r.status === 'rejected' || r.cancelled === true;
    const isApproved = r.status === 'approved' || (!r.status && !r.cancelled);
    
    // 1. รายการดั้งเดิม 
    if (isPending) {
        rows.push({ type: 'pending', id: r.id, date: r.date, employeeId: r.employeeId, points: -r.pointsSpent, note: note, raw: r });
    } else if (isApproved) {
        rows.push({ type: 'redeem', id: r.id, date: r.date, employeeId: r.employeeId, points: -r.pointsSpent, note: note, raw: r });
    }
    
    // 2. แถวรายการที่ยกเลิกแล้ว (คืนแต้ม) จะแสดงก็ต่อเมื่อถูกยกเลิก/ปฏิเสธ
    if(isRejected && (r.cancelDate || r.date)) {
      rows.push({
        type: 'cancel',
        date: r.cancelDate || r.date,
        employeeId: r.employeeId,
        points: r.pointsSpent,
        note: 'ยกเลิก/ปฏิเสธ: ' + note
      });
    }
  });
  
  rows.sort((a,b)=> new Date(b.date) - new Date(a.date));
  if(empVal) rows = rows.filter(r=>r.employeeId===empVal);
  if(typeVal) rows = rows.filter(r=>r.type===typeVal);

  const list = document.getElementById('ledgerList');
  if(rows.length===0){
    list.innerHTML = `<div class="empty-state">ไม่พบรายการ</div>`;
    return;
  }
  
  const badgeLabel = {earn:'ได้รับแต้ม', deduct:'ถูกหักแต้ม', redeem:'แลกรางวัล', pending:'รออนุมัติ', cancel:'คืนแต้ม'};
  list.innerHTML = rows.map(r=>{
    const emp = state.employees.find(e=>e.id===r.employeeId);
    const d = new Date(r.date);
    const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    
    let badgeClass = 'redeem';
    if(r.type === 'earn' || r.type === 'cancel') badgeClass = 'earn';
    if(r.type === 'pending') badgeClass = 'pending';
    
    // ปุ่มยกเลิกสำหรับพนักงานตัวเอง หรือแอดมิน
    const canCancel = (r.type === 'redeem' || r.type === 'pending') && (isAdmin || currentEmployeeId === r.employeeId);
    const cancelBtnHTML = canCancel 
      ? `<button class="btn small danger ghost" style="padding:0px 6px; font-size:11px; margin-left:6px; border-radius:4px; min-width:auto;" onclick="cancelRedemption('${r.id}')">ยกเลิก</button>` 
      : '';

    let ptsClass = r.points >= 0 ? 'pos' : 'neg';
    if (r.type === 'pending') ptsClass = 'warn';

    return `
      <div class="led-row">
        <div class="led-date">${dateStr}</div>
        <div class="led-badge ${badgeClass}">${badgeLabel[r.type]}</div>
        <div class="led-emp">
          <div class="n">${emp ? escapeHtml(emp.name) : 'พนักงาน (ถูกลบแล้ว)'}</div>
          <div class="note" style="display:flex; align-items:center;">
            <span>${escapeHtml(r.note)}</span>
            ${cancelBtnHTML}
          </div>
        </div>
        <div class="led-pts ${ptsClass}">
          ${r.points>=0?'+':''}${fmt(r.points)}
        </div>
      </div>
    `;
  }).join('');
}

// ฟังก์ชันกดยกเลิกรายการแลกของรางวัล
function cancelRedemption(redemptionId) {
  if(!confirm('คุณแน่ใจหรือไม่ว่าต้องการยกเลิกการแลกของรางวัลนี้และทำการ "คืนแต้ม"?')) return;
  const r = state.redemptions.find(x => x.id === redemptionId);
  if(!r) return;
  
  if(!isAdmin && currentEmployeeId !== r.employeeId) {
    alert('คุณไม่มีสิทธิ์ยกเลิกรายการของบุคคลอื่น');
    return;
  }
  
  if(r.cancelled || r.status === 'rejected') return; 
  
  r.status = 'rejected';
  r.cancelDate = new Date().toISOString(); 
  
  saveData();
  render();
  alert('ยกเลิกรายการสำเร็จ ระบบทำการคืนแต้มเรียบร้อยแล้ว');
}

/* ---------------- modal helpers ---------------- */
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('open');
}
document.getElementById('modalBackdrop').addEventListener('click', e=>{
  if(e.target.id==='modalBackdrop') closeModal();
});

/* ---------------- add employee ---------------- */
document.getElementById('btnAddEmployee').addEventListener('click', ()=>{ if(isAdmin) openEmployeeModal(); });
function openEmployeeModal(editId){
  if(!isAdmin) return;
  const editing = editId ? state.employees.find(e=>e.id===editId) : null;
  openModal(`
    <h3>${editing?'แก้ไขพนักงาน':'เพิ่มพนักงาน'}</h3>
    <div class="field"><label>ชื่อ-นามสกุล</label><input id="fName" value="${editing?escapeHtml(editing.name):''}" placeholder="เช่น สมชาย ใจดี"></div>
    <div class="field"><label>แผนก / ตำแหน่ง</label><input id="fDept" value="${editing?escapeHtml(editing.department||''):''}" placeholder="เช่น ฝ่ายขาย"></div>
    <div class="modal-error" id="mErr">กรุณากรอกชื่อพนักงาน</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn primary" onclick="saveEmployee('${editId||''}')">${editing?'บันทึก':'เพิ่มพนักงาน'}</button>
    </div>
  `);
}
function saveEmployee(id){
  if(!isAdmin) return;
  const name = document.getElementById('fName').value.trim();
  const dept = document.getElementById('fDept').value.trim();
  if(!name){ document.getElementById('mErr').style.display='block'; return; }
  if(id){
    const e = state.employees.find(x=>x.id===id);
    e.name=name; e.department=dept;
  } else {
    state.employees.push({id:uid(), name, department:dept, streak: 0});
  }
  saveData(); closeModal(); render();
}

function openEmployeeDetail(empId){
  const e = state.employees.find(x=>x.id===empId);
  if(!e) return;
  let rows = [];
  state.pointsLog.filter(p=>p.employeeId===empId).forEach(p=>{
    const isDeduct = p.points < 0;
    rows.push({type: isDeduct?'deduct':'earn', date:p.date, points:p.points, note:p.reason||(isDeduct?'หักแต้ม':'ให้แต้ม')});
  });
  
  state.redemptions.filter(r=>r.employeeId===empId).forEach(r=>{
    const rw = state.rewards.find(x=>x.id===r.rewardId);
    const note = rw?rw.name:'ของรางวัล (ถูกลบแล้ว)';
    
    if (r.status === 'pending') {
      rows.push({type: 'pending', date: r.date, points: -r.pointsSpent, note: 'รออนุมัติ: ' + note});
    } else if (r.status === 'approved' || (!r.status && !r.cancelled)) {
      rows.push({type: 'redeem', date: r.date, points: -r.pointsSpent, note: note});
    }
    
    if(r.status === 'rejected' || r.cancelled) {
      rows.push({type: 'cancel', date: r.cancelDate || r.date, points: r.pointsSpent, note: 'คืนแต้ม (ยกเลิก: ' + note + ')'});
    }
  });
  
  rows.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const yearly = getYearlyEarned(empId, selYear);
  const rank = getRank(e.streak || 0);
  
  openModal(`
    <h3>${escapeHtml(e.name)}</h3>
    <div class="subtle" style="margin-bottom:6px;">${escapeHtml(e.department||'')}</div>
    <div style="margin-bottom:14px;"><span class="rank-badge-text ${rank.class}">${rank.icon} ${rank.name} (Streak: ${e.streak||0})</span></div>
    
    <div class="detail-balance">
      <div><div class="num">${fmt(getBalance(empId))}</div><div class="lbl subtle">แต้มคงเหลือ</div></div>
      <div style="text-align:right"><div class="num" style="font-size:19px;color:var(--text-secondary)">${fmt(yearly)}</div><div class="lbl subtle">รวมปี ${selYear}</div></div>
    </div>
    
    <div class="modal-actions admin-only" style="justify-content:flex-start;margin-top:0;margin-bottom:10px;">
      <button class="btn small primary" onclick="closeModal();openAddPointsModal('${empId}','add')">ปรับแต้ม</button>
      <button class="btn small" onclick="closeModal();openAddPointsModal('${empId}','deduct')">ลดแต้ม</button>
      <button class="btn small" onclick="closeModal();openRedeemModal(null,'${empId}')">แลกรางวัล</button>
      <button class="btn small" onclick="openEmployeeModal('${empId}')">แก้ไข</button>
      <button class="btn small danger" onclick="deleteEmployee('${empId}')">ลบ</button>
    </div>
    <div class="subtle" style="margin-bottom:8px;">ประวัติล่าสุด</div>
    <div class="detail-history">
      ${rows.length===0 ? '<div class="empty-state">ยังไม่มีประวัติ</div>' : rows.map(r=>{
        const d=new Date(r.date);
        const dateStr = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        const lbl = {earn:'ได้รับ', deduct:'ถูกหัก', redeem:'แลก', cancel:'คืนแต้ม', pending:'รออนุมัติ'}[r.type];
        
        let badgeClass = 'redeem';
        if(r.type === 'earn' || r.type === 'cancel') badgeClass = 'earn';
        if(r.type === 'pending') badgeClass = 'pending';
        
        let ptsClass = r.points >= 0 ? 'pos' : 'neg';
        if(r.type === 'pending') ptsClass = 'warn';

        return `<div class="led-row"><div class="led-date">${dateStr}</div>
          <div class="led-badge ${badgeClass}">${lbl}</div>
          <div class="led-emp"><div class="note">${escapeHtml(r.note)}</div></div>
          <div class="led-pts ${ptsClass}">${r.points>=0?'+':''}${fmt(r.points)}</div></div>`;
      }).join('')}
    </div>
  `);
}
function deleteEmployee(id){
  if(!isAdmin) return;
  if(!confirm('ลบพนักงานคนนี้และประวัติทั้งหมด?')) return;
  state.employees = state.employees.filter(e=>e.id!==id);
  state.pointsLog = state.pointsLog.filter(p=>p.employeeId!==id);
  state.redemptions = state.redemptions.filter(r=>r.employeeId!==id);
  saveData(); closeModal(); render();
}

/* ---------------- add points ---------------- */
document.getElementById('btnAddPoints').addEventListener('click', ()=>{ if(isAdmin) openAddPointsModal(); });
function openAddPointsModal(empId, type){
  if(!isAdmin) return;
  if(state.employees.length===0){ alert('กรุณาเพิ่มพนักงานก่อน'); return; }
  const t = type === 'deduct' ? 'deduct' : 'add';
  openModal(`
    <h3>ปรับแต้มทั่วไป</h3>
    <div class="subtle" style="margin-bottom:12px;">หากต้องการให้แต้มแบบต่อเนื่อง (Streak) ให้กดปุ่ม "+ Streak" ที่หน้า Ranking แทน</div>
    <div class="seg-toggle" id="pTypeToggle">
      <button type="button" class="add ${t==='add'?'active':''}" onclick="setPointsType('add')">+ เพิ่มแต้ม</button>
      <button type="button" class="deduct ${t==='deduct'?'active':''}" onclick="setPointsType('deduct')">− ลดแต้ม</button>
    </div>
    <div class="field">
      <label>พนักงาน</label>
      <select id="pEmp">${state.employees.map(e=>`<option value="${e.id}" ${e.id===empId?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}</select>
    </div>
    <div class="field-row">
      <div class="field"><label>จำนวนแต้ม</label><input id="pPoints" type="number" step="0.5" min="0.5" value="1"></div>
      <div class="field"><label>เดือน / ปี</label>
        <select id="pMonth" style="margin-bottom:6px;">${MONTHS_TH.map((m,i)=>`<option value="${i+1}" ${i+1===selMonth?'selected':''}>${m}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field"><label>เหตุผล / หมายเหตุ</label><input id="pReason" placeholder="เช่น ทำงานดีเกินเป้า หรือ มาสายบ่อย"></div>
    <div class="modal-error" id="mErr">กรุณากรอกจำนวนแต้มให้ถูกต้อง</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn primary" id="pSaveBtn" onclick="saveAddPoints()">${t==='deduct'?'ลดแต้ม':'เพิ่มแต้ม'}</button>
    </div>
  `);
}
function setPointsType(t){
  document.querySelectorAll('#pTypeToggle button').forEach(b=>{
    b.classList.toggle('active', b.classList.contains(t));
  });
  document.getElementById('pSaveBtn').textContent = t==='deduct' ? 'ลดแต้ม' : 'เพิ่มแต้ม';
  document.getElementById('pSaveBtn').dataset.type = t;
}
function saveAddPoints(){
  if(!isAdmin) return;
  const activeBtn = document.querySelector('#pTypeToggle button.active');
  const type = activeBtn && activeBtn.classList.contains('deduct') ? 'deduct' : 'add';
  const employeeId = document.getElementById('pEmp').value;
  const amount = Number(document.getElementById('pPoints').value);
  const month = Number(document.getElementById('pMonth').value);
  const reason = document.getElementById('pReason').value.trim();
  if(!amount || amount<=0){ document.getElementById('mErr').style.display='block'; return; }
  const points = type==='deduct' ? -amount : amount;
  state.pointsLog.push({id:uid(), employeeId, points, month, year:selYear, reason, date:new Date().toISOString()});
  saveData(); closeModal(); render();
}

/* ---------------- rewards ---------------- */
document.getElementById('btnAddReward').addEventListener('click', ()=>{ if(isAdmin) openAddRewardModal(); });
function openAddRewardModal(editId){
  if(!isAdmin) return;
  const editing = editId ? state.rewards.find(r=>r.id===editId) : null;
  openModal(`
    <h3>${editing?'แก้ไขของรางวัล':'เพิ่มของรางวัล'}</h3>
    <div class="field"><label>ชื่อของรางวัล</label><input id="rName" value="${editing?escapeHtml(editing.name):''}" placeholder="เช่น บัตรกำนัลร้านกาแฟ"></div>
    <div class="field"><label>ใช้กี่แต้ม</label><input id="rCost" type="number" min="0.5" step="0.5" value="${editing?editing.cost:10}"></div>
    <div class="modal-error" id="mErr">กรุณากรอกชื่อและแต้มให้ถูกต้อง</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn primary" onclick="saveReward('${editId||''}')">${editing?'บันทึก':'เพิ่มของรางวัล'}</button>
    </div>
  `);
}
function saveReward(id){
  if(!isAdmin) return;
  const name = document.getElementById('rName').value.trim();
  const cost = Number(document.getElementById('rCost').value);
  if(!name || !cost || cost<=0){ document.getElementById('mErr').style.display='block'; return; }
  if(id){
    const r = state.rewards.find(x=>x.id===id);
    r.name=name; r.cost=cost;
  } else {
    state.rewards.push({id:uid(), name, cost});
  }
  saveData(); closeModal(); render();
}
function deleteReward(id){
  if(!isAdmin) return;
  if(!confirm('ลบของรางวัลนี้?')) return;
  state.rewards = state.rewards.filter(r=>r.id!==id);
  saveData(); render();
}

/* ---------------- redeem ---------------- */
function openRedeemModal(rewardId, empId){
  if(!isAdmin) return;
  if(state.employees.length===0){ alert('กรุณาเพิ่มพนักงานก่อน'); return; }
  if(state.rewards.length===0){ alert('กรุณาเพิ่มของรางวัลก่อน'); return; }
  openModal(`
    <h3>แอดมินแลกของรางวัลให้พนักงาน</h3>
    <div class="subtle" style="margin-bottom:14px;">การแลกโดยแอดมินจะได้รับการ "อนุมัติทันที" โดยไม่ต้องรอยืนยัน</div>
    <div class="field">
      <label>พนักงาน</label>
      <select id="xEmp" onchange="updateRedeemBalance()">${state.employees.map(e=>`<option value="${e.id}" ${e.id===empId?'selected':''}>${escapeHtml(e.name)} (${fmt(getBalance(e.id))} แต้ม)</option>`).join('')}</select>
    </div>
    <div class="field">
      <label>ของรางวัล</label>
      <select id="xReward" onchange="updateRedeemBalance()">${state.rewards.map(r=>`<option value="${r.id}" ${r.id===rewardId?'selected':''}>${escapeHtml(r.name)} — ${fmt(r.cost)} แต้ม</option>`).join('')}</select>
    </div>
    <div class="subtle" id="xBalanceInfo" style="margin-bottom:10px;"></div>
    <div class="modal-error" id="mErr">แต้มคงเหลือไม่พอสำหรับของรางวัลนี้</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn primary" onclick="confirmRedeem()">ยืนยันแลก</button>
    </div>
  `);
  updateRedeemBalance();
}
function updateRedeemBalance(){
  const empId = document.getElementById('xEmp').value;
  const rewardId = document.getElementById('xReward').value;
  const bal = getBalance(empId);
  const reward = state.rewards.find(r=>r.id===rewardId);
  const after = bal - (reward?reward.cost:0);
  document.getElementById('xBalanceInfo').innerHTML =
    `แต้มคงเหลือ <strong style="color:var(--accent)">${fmt(bal)}</strong> → หลังแลก <strong style="color:${after<0?'var(--negative)':'var(--accent)'}">${fmt(after)}</strong>`;
}

// Admin ดำเนินการแลกเอง อนุมัติทันที
function confirmRedeem(){
  if(!isAdmin) return;
  const employeeId = document.getElementById('xEmp').value;
  const rewardId = document.getElementById('xReward').value;
  const reward = state.rewards.find(r=>r.id===rewardId);
  const bal = getBalance(employeeId);
  if(!reward || bal < reward.cost){ document.getElementById('mErr').style.display='block'; return; }
  state.redemptions.push({
    id: uid(), employeeId, rewardId, pointsSpent: reward.cost, date: new Date().toISOString(), status: 'approved'
  });
  saveData(); closeModal(); render();
  showStamp('แลกแล้ว');
}

// พนักงานส่งคำขอแลก
function redeemSelf(rewardId){
  if(!currentEmployeeId) return;
  const reward = state.rewards.find(r=>r.id===rewardId);
  if(!reward) return;
  const bal = getBalance(currentEmployeeId);
  if(bal < reward.cost){ alert('แต้มคงเหลือของคุณไม่พอสำหรับของรางวัลนี้ (หรือแต้มคุณถูกกันไว้ในคำขอที่รออนุมัติอยู่)'); return; }
  
  if(!confirm(`ยืนยันส่งคำขอแลก "${reward.name}" ด้วย ${fmt(reward.cost)} แต้ม?\n(คำขอจะถูกส่งให้แอดมินอนุมัติ แต้มจะถูกหักทันที และจะคืนให้หากถูกปฏิเสธ)`)) return;
  
  state.redemptions.push({
    id: uid(), 
    employeeId: currentEmployeeId, 
    rewardId, 
    pointsSpent: reward.cost, 
    date: new Date().toISOString(),
    status: 'pending'
  });
  saveData(); render();
  showStamp('รออนุมัติ');
}

function showStamp(text = 'แลกแล้ว'){
  const el = document.getElementById('stampMark');
  el.textContent = text;
  el.classList.remove('show'); void el.offsetWidth;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1100);
}

/* ---------------- Theme ---------------- */
const sunIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>`;
const moonIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>`;
function applyTheme(mode){
  document.body.setAttribute('data-theme', mode);
  document.getElementById('themeToggle').innerHTML = mode==='dark' ? sunIcon : moonIcon;
  const meta = document.getElementById('themeColorMeta');
  if(meta) meta.setAttribute('content', mode==='dark' ? '#14171a' : '#faf9f6');
}
function initTheme(){
  let mode = null;
  try{
    mode = localStorage.getItem('theme-preference');
  }catch(e){ /* no preference saved yet */ }
  if(!mode){
    mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  applyTheme(mode);
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const current = document.body.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try{ localStorage.setItem('theme-preference', next); }catch(e){ console.error('theme save failed', e); }
});

/* ---------------- tabs & init ---------------- */
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click', ()=>{ activeTab = b.dataset.tab; render(); });
});

initTheme();
loadData();
</script>
